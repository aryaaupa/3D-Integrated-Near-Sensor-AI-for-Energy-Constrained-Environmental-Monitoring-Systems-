   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1d242a" x="123.84" y="59.343098" transform="rotate(-0 123.84 59.343098)">Sensing and front-end tier</text>
   </g>
   <g id="text_3">
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d242a" transform="translate(72.656234 69.21137)">Sensor interface, acquisition, and</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d242a" transform="translate(105.0215 75.346778)">conditioning</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d242a" transform="translate(65.294297 81.482187)">Conceptual tier; sensing accuracy and</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d242a" transform="translate(75.591383 87.617596)">thermal behavior not simulated</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1d242a" x="123.84" y="138.658298" transform="rotate(-0 123.84 138.658298)">Localized-memory tier</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d242a" transform="translate(70.75618 151.594274)">Working-set storage near compute</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d242a" transform="translate(68.391 157.729683)">Evaluated architectural proxy: 2-MiB</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d242a" transform="translate(100.851102 163.865091)">localized SRAM</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1d242a" x="123.84" y="221.177356" transform="rotate(-0 123.84 221.177356)">Compute tier</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d242a" transform="translate(89.32925 237.342818)">168-PE array (14 x 12)</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d242a" transform="translate(53.771492 243.478227)">128-KiB global SRAM + PE-local RFs + integer</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #1d242a" transform="translate(115.456789 249.613635)">MACs</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #68727a" transform="translate(232.153091 174.984272) rotate(-90)">conceptual vertical</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #68727a" transform="translate(239.095734 183.714162) rotate(-90)">inter-tier communication</text>
   </g>
   <g id="text_9">
    <text style="font-size: 5.7px; font-family: 'DejaVu Sans'; fill: #1d242a" transform="translate(26.688844 281.24582)">Architectural organization only - no physical dimensions, TSV count,</text>
